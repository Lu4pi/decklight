name: Release

# Ein Tag `vX.Y.Z` baut signierte Installer für macOS (Universal) und Windows und
# legt sie als Entwurf auf der Release-Seite ab; veröffentlicht wird von Hand.
# Von Hand gestartet (workflow_dispatch) oder per Push auf einen Branch
# `testbuild/...` darf der Lauf zum Testen unsigniert sein; die Installer liegen
# dann als Artefakte am Lauf.
#
# Secrets (Repository → Settings → Secrets and variables → Actions):
#   macOS:   APPLE_CERTIFICATE (Developer-ID-Application-Zertifikat als .p12, base64),
#            APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#            ("Developer ID Application: Name (TEAMID)"), zum Notarisieren
#            APPLE_ID, APPLE_PASSWORD (app-spezifisches Passwort), APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE (Code-Signing-Zertifikat als .pfx, base64),
#            WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ["v*"]
    branches: ["testbuild/**"]
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: Ohne Zertifikate bauen (nur zum Testen, wird kein Release)
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag, Cargo.toml und tauri.conf.json stimmen überein
        run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tauri_v=$(jq -r .version src-tauri/tauri.conf.json)
          echo "Cargo $cargo_v, Tauri $tauri_v"
          test "$cargo_v" = "$tauri_v"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v$cargo_v" || { echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu Version $cargo_v"; exit 1; }
          fi
          echo "version=$cargo_v" >> "$GITHUB_OUTPUT"

  build:
    name: Installer (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      UNSIGNED_OK: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_unsigned) || startsWith(github.ref, 'refs/heads/testbuild/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui

      - name: Zertifikate vorhanden?
        id: certs
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ "${{ matrix.name }}" = "macOS" ]; then have="${APPLE_CERTIFICATE:+yes}"; else have="${WINDOWS_CERTIFICATE:+yes}"; fi
          if [ "$have" = "yes" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UNSIGNED_OK" = "true" ]; then
            echo "::warning::Kein Zertifikat für ${{ matrix.name }}: Installer bleibt unsigniert (Testlauf)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Kein Zertifikat für ${{ matrix.name }}. Secrets eintragen (siehe Kopf dieser Datei)."
            exit 1
          fi

      - name: Windows-Zertifikat importieren
        id: wincert
        if: matrix.name == 'Windows' && steps.certs.outputs.signed == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = Join-Path $env:RUNNER_TEMP "tauri.sign.json"
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } |
            ConvertTo-Json -Depth 5 | Set-Content -Path $conf -Encoding utf8NoBOM
          "config=$($conf -replace '\\','/')" >> $env:GITHUB_OUTPUT

      - name: Desktop-App bauen und Installer hochladen
        if: steps.certs.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: >-
            ${{ matrix.args }}
            ${{ steps.wincert.outputs.config && format('--config {0}', steps.wincert.outputs.config) || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: DeckLight ${{ needs.check.outputs.version }}
          releaseBody: |
            Installer für macOS (Intel und Apple Silicon) und Windows, dazu das
            Kommandozeilen-Werkzeug `decklight` (Simulator, Mitschnitte, Dauerlauf).
            Einrichtung: https://github.com/Lu4pi/decklight/blob/main/docs/einrichtung.md
          releaseDraft: true
          prerelease: false

      # Testlauf ohne Zertifikat: leere APPLE_*-Variablen ließen tauri eine
      # Zertifikat-Einfuhr versuchen, deshalb ein eigener Schritt ohne sie.
      - name: Desktop-App bauen (unsigniert)
        if: steps.certs.outputs.signed != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc-Signatur: Apple Silicon startet sonst gar nicht; ohne
          # Developer-ID warnt Gatekeeper trotzdem (Rechtsklick → Öffnen).
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: >-
            ${{ matrix.args }}
            ${{ steps.wincert.outputs.config && format('--config {0}', steps.wincert.outputs.config) || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: DeckLight ${{ needs.check.outputs.version }}
          releaseBody: |
            Installer für macOS (Intel und Apple Silicon) und Windows, dazu das
            Kommandozeilen-Werkzeug `decklight` (Simulator, Mitschnitte, Dauerlauf).
            Einrichtung: https://github.com/Lu4pi/decklight/blob/main/docs/einrichtung.md
          releaseDraft: true
          prerelease: false

      - name: Signatur prüfen (macOS)
        if: matrix.name == 'macOS' && steps.certs.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          # Gatekeeper akzeptiert die App nur notarisiert.
          if [ -n "$APPLE_ID" ]; then spctl --assess --type execute --verbose "$app"; fi

      - name: Signatur prüfen (Windows)
        if: matrix.name == 'Windows' && steps.certs.outputs.signed == 'true'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($s.Status)"
            if ($s.Status -ne 'Valid') { throw "Nicht gültig signiert: $($_.Name)" }
          }

      - name: Kommandozeilen-Werkzeug bauen
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cargo build --release -p decklight --target aarch64-apple-darwin
            cargo build --release -p decklight --target x86_64-apple-darwin
            lipo -create -output dist/decklight \
              target/aarch64-apple-darwin/release/decklight target/x86_64-apple-darwin/release/decklight
            (cd dist && zip -q decklight-cli-macos-universal.zip decklight)
          else
            cargo build --release -p decklight
            cp target/release/decklight.exe dist/
            (cd dist && 7z a -bd decklight-cli-windows-x64.zip decklight.exe > /dev/null)
          fi

      - name: Werkzeug an den Release hängen
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber

      - name: Artefakte (Testlauf)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: decklight-${{ matrix.name }}
          path: |
            dist/*.zip
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
