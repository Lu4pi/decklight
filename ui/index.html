<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Handy: „Zum Home-Bildschirm“ öffnet DeckLight im Vollbild wie eine App. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DeckLight" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-256.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DeckLight</title>
    <!-- Startbildschirm: steht direkt im HTML, damit er schon beim ersten Bild
         da ist, bevor Skripte und Kern geladen sind. App.svelte blendet ihn aus. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(ellipse at 50% 38%, #15151d 0%, #000 62%);
        color: #f2f2f6;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.5s ease, transform 0.5s ease;
        user-select: none;
        cursor: default;
      }
      #splash.out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #splash svg {
        width: min(240px, 52vw);
        height: auto;
        overflow: visible;
      }
      #splash .lamp {
        animation: sp-lamp 0.5s ease-out both;
      }
      #splash .beam {
        transform-origin: 120px 30px;
        animation: sp-beam-on 0.9s 0.35s ease-out both, sp-sweep 3.2s 1.25s ease-in-out infinite;
      }
      #splash .beam path {
        animation: sp-pulse 0.5s 1.25s ease-out infinite;
      }
      #splash .deck {
        animation: sp-drop 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      #splash .deck.d2 {
        animation-delay: 0.15s;
      }
      #splash .spin {
        animation: sp-spin 1.6s linear infinite;
      }
      #splash .d1 .spin {
        transform-origin: 74px 186px;
      }
      #splash .d2 .spin {
        transform-origin: 166px 186px;
        animation-duration: 1.9s;
      }
      #splash .word {
        font-weight: 800;
        font-size: 30px;
        letter-spacing: 0.32em;
        margin-right: -0.32em;
        animation: sp-word 0.9s 0.5s ease-out both;
      }
      #splash .word b {
        color: #f0782a;
        font-weight: 800;
      }
      #splash .beats {
        display: flex;
        gap: 8px;
        animation: sp-fade 0.4s 0.9s both;
      }
      #splash .beats i {
        width: 34px;
        height: 6px;
        border-radius: 2px;
        background: #22222c;
        animation: sp-beat 2s 1.25s steps(1) infinite;
      }
      #splash .beats i:nth-child(2) { animation-delay: 1.75s; }
      #splash .beats i:nth-child(3) { animation-delay: 2.25s; }
      #splash .beats i:nth-child(4) { animation-delay: 2.75s; }
      #splash .status {
        min-height: 1.2em;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8c8c9c;
        animation: sp-fade 0.4s 1s both;
      }
      @keyframes sp-lamp { from { opacity: 0; transform: translateY(-12px); } }
      @keyframes sp-beam-on { from { opacity: 0; transform: scaleY(0.2); } }
      @keyframes sp-sweep {
        0%, 100% { transform: rotate(-9deg); }
        50% { transform: rotate(9deg); }
      }
      @keyframes sp-pulse {
        0% { fill-opacity: 0.55; }
        100% { fill-opacity: 0.28; }
      }
      @keyframes sp-drop { from { opacity: 0; transform: translateY(26px); } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @keyframes sp-word { from { opacity: 0; letter-spacing: 0.9em; margin-right: -0.9em; filter: blur(6px); } }
      @keyframes sp-fade { from { opacity: 0; } }
      @keyframes sp-beat {
        0% { background: #f0782a; box-shadow: 0 0 12px #f0782a; }
        25%, 100% { background: #22222c; box-shadow: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation: none !important; transition: opacity 0.2s !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="DeckLight startet">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="sp-cone" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6b13a" />
            <stop offset="1" stop-color="#f6b13a" stop-opacity="0.15" />
          </linearGradient>
        </defs>
        <g class="beam"><path d="M104 34 28 222h184L136 34z" fill="url(#sp-cone)" fill-opacity="0.4" /></g>
        <rect class="lamp" x="100" y="14" width="40" height="20" rx="3" fill="#f6b13a" />
        <g class="deck d1">
          <circle cx="74" cy="186" r="40" fill="#0b0b0f" stroke="#2fa8ff" stroke-width="10" />
          <g class="spin">
            <circle cx="74" cy="186" r="7" fill="#2fa8ff" />
            <rect x="71" y="152" width="6" height="14" rx="3" fill="#2fa8ff" />
          </g>
        </g>
        <g class="deck d2">
          <circle cx="166" cy="186" r="40" fill="#0b0b0f" stroke="#ff8a1f" stroke-width="10" />
          <g class="spin">
            <circle cx="166" cy="186" r="7" fill="#ff8a1f" />
            <rect x="163" y="152" width="6" height="14" rx="3" fill="#ff8a1f" />
          </g>
        </g>
      </svg>
      <div class="word">DECK<b>LIGHT</b></div>
      <div class="beats"><i></i><i></i><i></i><i></i></div>
      <div class="status" id="splash-status">Startet</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
