[workspace]
resolver = "2"
members = ["crates/*"]
# Die Tauri-Hülle braucht System-WebView-Bibliotheken und wird separat gebaut.
exclude = ["src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Lu4pi/decklight"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
if-addrs = "0.13"
mac_address = "1"
midir = "0.11"
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

decklight-prolink = { path = "crates/prolink" }
decklight-simulator = { path = "crates/simulator" }
decklight-engine = { path = "crates/engine" }
decklight-outputs = { path = "crates/outputs" }
decklight-show = { path = "crates/show" }
decklight-core = { path = "crates/core" }
decklight-library = { path = "crates/library" }
decklight-triggers = { path = "crates/triggers" }
decklight-server = { path = "crates/server" }
decklight-auto = { path = "crates/auto" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
